name: Process HeyGen Avatar Videos

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: Approved marketing content UUID
        required: true
        type: string

concurrency:
  group: heygen-avatar-${{ inputs.content_id }}
  cancel-in-progress: false

jobs:
  render-avatar-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Poll HeyGen and compose Reel with FFmpeg
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vgduzuvnhyebymhywmse.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$HEYGEN_API_KEY" || (echo "Missing HEYGEN_API_KEY secret" && exit 1)
          npx tsx scripts/process-heygen-avatar-videos.ts "${{ inputs.content_id }}"