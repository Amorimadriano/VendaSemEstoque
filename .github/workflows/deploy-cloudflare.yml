name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  configuration:
    runs-on: ubuntu-latest
    name: Check Cloudflare configuration
    steps:
      - name: Check payment variable names without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/venda-sem-estoque`, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
          });
          if (!response.ok) throw new Error(`Cloudflare configuration HTTP ${response.status}`);
          const body = await response.json();
          if (!body.success) throw new Error('Cloudflare did not return the project configuration');
          const project = body.result;
          const variables = (environment) => Object.entries(environment?.env_vars || {})
            .filter(([name]) => /^(PARTNER_|MERCADOPAGO_)/.test(name))
            .map(([name, value]) => ({ name, type: value.type }));
          console.log(JSON.stringify({
            project: project.name,
            productionBranch: project.production_branch,
            production: variables(project.deployment_configs?.production),
            preview: variables(project.deployment_configs?.preview),
            latestProductionDeployment: project.canonical_deployment ? {
              id: project.canonical_deployment.id,
              environment: project.canonical_deployment.environment,
              variables: variables(project.canonical_deployment),
            } : null,
          }, null, 2));
          NODE

  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client & Build Next.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
        run: |
          npx prisma generate
          npm run build
          npx @cloudflare/next-on-pages

      - name: Deploy to Cloudflare Pages & Automation Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create venda-sem-estoque --production-branch=main || true
          npx wrangler pages deploy .vercel/output/static --project-name=venda-sem-estoque
          npx wrangler deploy --config cloudflare/automation-worker.wrangler.toml
