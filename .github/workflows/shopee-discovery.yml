name: Discover Shopee Affiliate Products

on:
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Discover and sync Shopee affiliate products
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vgduzuvnhyebymhywmse.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.SUPABASE_POOLER_DATABASE_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_DATABASE_URL || secrets.DIRECT_URL }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          PRODUCT_SEARCHES: ${{ vars.SHOPEE_PRODUCT_SEARCHES || vars.PRODUCT_SEARCHES || 'eletronicos,celular,fones,notebook,smart tv,casa' }}
          PRODUCT_MIN_PRICE: ${{ vars.PRODUCT_MIN_PRICE || '20' }}
          PRODUCT_MAX_PRICE: ${{ vars.PRODUCT_MAX_PRICE || '15000' }}
          MARKETPLACES_TO_SYNC: shopee
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$SHOPEE_APP_ID" || (echo "Missing SHOPEE_APP_ID secret" && exit 1)
          test -n "$SHOPEE_SECRET" || (echo "Missing SHOPEE_SECRET secret" && exit 1)
          npm run products:discover
