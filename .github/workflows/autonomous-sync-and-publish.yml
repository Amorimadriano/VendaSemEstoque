name: Marketplace Sync and Instagram Auto-Publish

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  instagram_auto_publish:
    runs-on: ubuntu-latest
    concurrency:
      group: instagram-marketplace-auto-publish
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Sync marketplaces and publish to Instagram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vgduzuvnhyebymhywmse.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.SUPABASE_POOLER_DATABASE_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_DATABASE_URL || secrets.DIRECT_URL }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://venda-sem-estoque.pages.dev' }}
          PRODUCT_SEARCHES: ${{ vars.PRODUCT_SEARCHES || 'eletronicos,celular,fones,notebook,smart tv,casa' }}
          PRODUCT_MIN_PRICE: ${{ vars.PRODUCT_MIN_PRICE || '20' }}
          PRODUCT_MAX_PRICE: ${{ vars.PRODUCT_MAX_PRICE || '15000' }}
          MARKETPLACES_TO_SYNC: ${{ vars.MARKETPLACES_TO_SYNC || 'amazon,aliexpress,shopee' }}
        run: |
          npx tsx -e "
            import { runProductDiscovery } from './services/productDiscovery';
            import { publishPendingChannelBatch } from './services/batchPublishService';

            async function main() {
              const sync = await runProductDiscovery();
              console.log('Marketplace sync finished:', JSON.stringify(sync, null, 2));

              const result = await publishPendingChannelBatch('instagram', { maxItems: 1 });
              console.log('Instagram auto-publish finished:', JSON.stringify(result, null, 2));
              if (result.failed > 0) process.exitCode = 1;
            }

            main().catch(err => {
              console.error('Instagram workflow failed:', err);
              process.exit(1);
            });
          "
