name: Discover Mercado Livre Products

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Discover and sync products
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vgduzuvnhyebymhywmse.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.SUPABASE_POOLER_DATABASE_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_DATABASE_URL || secrets.DIRECT_URL }}
          MERCADOLIVRE_CLIENT_ID: ${{ secrets.MERCADOLIVRE_CLIENT_ID }}
          MERCADOLIVRE_CLIENT_SECRET: ${{ secrets.MERCADOLIVRE_CLIENT_SECRET }}
          MERCADOLIVRE_TOOL_ID: ${{ secrets.MERCADOLIVRE_TOOL_ID }}
          MERCADOLIVRE_ACCESS_TOKEN: ${{ secrets.MERCADOLIVRE_ACCESS_TOKEN }}
          MERCADOLIVRE_REFRESH_TOKEN: ${{ secrets.MERCADOLIVRE_REFRESH_TOKEN }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          MERCADOLIVRE_COMMISSION_PERCENTAGE: ${{ vars.MERCADOLIVRE_COMMISSION_PERCENTAGE || '10' }}
          PRODUCT_SEARCHES: ${{ vars.PRODUCT_SEARCHES || 'eletronicos,celular,fones,notebook,smart tv,casa' }}
          PRODUCT_MIN_PRICE: ${{ vars.PRODUCT_MIN_PRICE || '30' }}
          PRODUCT_MAX_PRICE: ${{ vars.PRODUCT_MAX_PRICE || '5000' }}
          MARKETPLACES_TO_SYNC: ${{ vars.MARKETPLACES_TO_SYNC || 'mercadolivre' }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          test -n "$MERCADOLIVRE_REFRESH_TOKEN" || (echo "Missing MERCADOLIVRE_REFRESH_TOKEN secret" && exit 1)
          node - <<'NODE'
          const response = await fetch('https://api.mercadolibre.com/oauth/token', {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'refresh_token',
              client_id: process.env.MERCADOLIVRE_CLIENT_ID,
              client_secret: process.env.MERCADOLIVRE_CLIENT_SECRET,
              refresh_token: process.env.MERCADOLIVRE_REFRESH_TOKEN,
            }),
          });
          if (!response.ok) {
            const body = await response.text();
            console.error(`Mercado Livre OAuth refresh failed (${response.status}): ${body.slice(0, 300)}`);
            process.exit(1);
          }
          console.log('Mercado Livre OAuth refresh succeeded');
          NODE
          npm run products:discover
