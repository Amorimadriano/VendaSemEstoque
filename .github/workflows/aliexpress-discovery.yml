name: Discover AliExpress Products

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Discover and sync AliExpress products
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vgduzuvnhyebymhywmse.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.SUPABASE_POOLER_DATABASE_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_DATABASE_URL || secrets.DIRECT_URL }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          ALIEXPRESS_COMMISSION_PERCENTAGE: ${{ vars.ALIEXPRESS_COMMISSION_PERCENTAGE || '8' }}
          PRODUCT_SEARCHES: ${{ vars.ALIEXPRESS_PRODUCT_SEARCHES || vars.PRODUCT_SEARCHES || 'eletronicos,celular,fones,notebook,casa' }}
          PRODUCT_MIN_PRICE: ${{ vars.PRODUCT_MIN_PRICE || '30' }}
          PRODUCT_MAX_PRICE: ${{ vars.PRODUCT_MAX_PRICE || '5000' }}
          MARKETPLACES_TO_SYNC: aliexpress
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)
          npm run products:discover
